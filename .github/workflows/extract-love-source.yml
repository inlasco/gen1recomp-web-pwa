name: Extract current LOVE launcher source

on:
  push:
    branches:
      - chatgpt/inlascomp-launcher-v1
    paths:
      - .github/workflows/extract-love-source.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/inlascomp-launcher-v1
          fetch-depth: 0

      - name: Extract current production launcher sources
        shell: bash
        run: |
          set -euo pipefail
          archive="game-v13.4-fr.love"
          test -f "$archive"
          mkdir -p tools/launcher/current
          for path in \
            main.lua \
            src/import/LauncherView.lua \
            src/import/LauncherSettings.lua \
            src/import/RomImporter.lua \
            src/core/GameVersion.lua \
            src/mods/LauncherMods.lua; do
            out="tools/launcher/current/$path"
            mkdir -p "$(dirname "$out")"
            unzip -p "$archive" "$path" > "$out"
            test -s "$out"
          done
          sha256sum "$archive" > tools/launcher/current/LOVE-SHA256.txt

      - name: Commit extracted text sources on the test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "inlasComp launcher bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/launcher/current
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "dev: extract current LOVE launcher sources"
          git push origin HEAD:chatgpt/inlascomp-launcher-v1
