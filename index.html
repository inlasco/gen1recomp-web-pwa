<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050611">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="inlasComp">
  <title>inlasComp — Gen1Recomp</title>
  <link rel="manifest" href="manifest.webmanifest?v=13.3-pwa-final">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app-v13.css?v=13.4-fr-r3">
  <link rel="stylesheet" href="inlascomp-launcher.css?v=1">
</head>
<body>
  <main id="app" aria-label="Gen1Recomp Web">
    <div id="game-frame">
      <canvas id="canvas" tabindex="0" aria-label="Gen1Recomp"></canvas>
      <div id="spinner" class="pending" role="status" aria-live="polite">
        <span class="spinner-dot"></span>
        <span>Chargement de Gen1Recomp…</span>
      </div>
    </div>
    <!-- Pas de barre de boutons : le launcher est l'interface. Quand il
         demande une ROM, le moteur écrit web-pick-request.txt et
         web-bridge-v13.js garde le flux historique comme fallback. Le nouveau
         shell inlasComp ouvre le même picker depuis un vrai geste DOM, ce qui
         reste compatible iOS tout en laissant RomImporter propriétaire de la
         validation, du SHA-1, des caches et du lancement. -->
    <span id="web-status" role="status" aria-live="polite"
          style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0"
          >Initialisation…</span>
    <input id="rom-picker" type="file" accept=".gb,.gbc,application/octet-stream" hidden>
  </main>
  <noscript>JavaScript est indispensable pour exécuter la version WebAssembly.</noscript>
  <script src="web-mod-import.js?v=13.3-pwa-final"></script>
  <script src="web-bridge-v13.js?v=13.4-fr-r4"></script>
  <script src="inlascomp-launcher.js?v=1"></script>
  <!-- boot-guard.js vérifie le cache de paquets IndexedDB de player.js puis
       injecte player.js. Sans lui, un .love téléversé de travers reste
       épinglé dans le navigateur et aucun retéléversement ne le remplace. -->
  <script src="boot-guard.js?v=13.4-fr-inlascomp-v1"></script>
  <script>
    // Enregistré après le chargement, pour ne pas concurrencer les propres
    // requêtes du moteur (love.wasm, l'archive du jeu).
    //
    // updateViaCache:"none" est le point important : le script du worker
    // lui-même doit toujours être revalidé. Sans ça, une livraison — et
    // l'interrupteur KILL qu'elle contient — pourrait rester bloquée
    // derrière une copie en cache, ce qui est exactement le problème que ce
    // worker est là pour supprimer.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("sw.js", { scope: "./", updateViaCache: "none" })
          .then(function (registration) { registration.update(); })
          .catch(function (error) { console.warn("SW registration failed", error); });
      }, { once: true });
    }
  </script>
</body>
</html>
