<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gen1Recomp">
  <title>Gen1Recomp PWA v13.3 Viewport Final</title>
  <link rel="manifest" href="manifest.webmanifest?v=13.3-pwa-final">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app-v13.css?v=13.3-pwa-final">
</head>
<body>
  <main id="app" aria-label="Gen1Recomp Web">
    <div id="game-frame">
      <canvas id="canvas" tabindex="0" aria-label="Gen1Recomp"></canvas>
      <div id="spinner" class="pending" role="status" aria-live="polite">
        <span class="spinner-dot"></span>
        <span>Chargement de Gen1Recomp…</span>
      </div>
    </div>
    <!-- The preparation rack is NOT decoration and must not be removed.
         Two reasons, both measured:

         1. iOS only opens a file picker from a real DOM user gesture.  The
            launcher's own Choose ROM button lives inside the canvas: SDL
            hands the touch to Lua a frame later, and the resulting
            Gen1WebBridge.pickRom() call is no longer inside that gesture, so
            Safari refuses it and nothing happens.  These buttons are the only
            import path the platform actually allows.

         2. #app is a two-row grid (minmax(0,1fr) auto) and this div is the
            second row.  Dropping it changes #game-frame's height and the
            presentation scale with it -- 844x337 and 0.9362 with the rack,
            844x390 and 1.0000 without, on a 390x844 device.  The validated
            viewport work assumes the first shape. -->
    <div id="web-tools">
      <button id="rom-button" type="button">Importer une ROM</button>
      <button id="mod-button" type="button" disabled>Importer un mod</button>
      <button id="fullscreen-button" type="button">Plein écran</button>
      <span id="web-status" role="status" aria-live="polite">Initialisation…</span>
    </div>
    <input id="rom-picker" type="file" accept=".gb,.gbc,application/octet-stream" hidden>
  </main>
  <noscript>JavaScript est indispensable pour exécuter la version WebAssembly.</noscript>
  <script src="web-mod-import.js?v=13.3-pwa-final"></script>
  <script src="web-bridge-v13.js?v=13.4-fr-r2"></script>
  <!-- boot-guard.js verifies player.js's IndexedDB package cache and then
       injects player.js itself.  It has to run BEFORE player.js, which is why
       the player is not a static tag here: a truncated download that reached
       that cache would otherwise be replayed on every visit and no amount of
       re-uploading would fix it.  See boot-guard.js. -->
  <script src="boot-guard.js?v=13.4-fr"></script>
  <script>
    // Registered after load so it never competes with the engine's own
    // fetches for the wasm and the game archive.  updateViaCache:"none" is
    // explicit: the worker script itself must always be revalidated, or a
    // deploy -- and the kill switch inside it -- could be cached out.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("sw.js", { scope: "./", updateViaCache: "none" })
          .then(function (registration) { registration.update(); })
          .catch(function (error) { console.warn("SW registration failed", error); });
      }, { once: true });
    }
  </script>
</body>
</html>
