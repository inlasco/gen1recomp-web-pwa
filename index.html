<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gen1Recomp">
  <title>Gen1Recomp PWA v13.3 Viewport Final</title>
  <link rel="manifest" href="manifest.webmanifest?v=13.3-pwa-final">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app-v13.css?v=13.3-pwa-final">
</head>
<body>
  <main id="app" aria-label="Gen1Recomp Web">
    <div id="game-frame">
      <canvas id="canvas" tabindex="0" aria-label="Gen1Recomp"></canvas>
      <div id="spinner" class="pending" role="status" aria-live="polite">
        <span class="spinner-dot"></span>
        <span>Chargement de Gen1Recomp…</span>
      </div>
    </div>
    <!-- The visible preparation rack (rom-button / mod-button /
         fullscreen-button) is gone: the launcher's own controls are the
         interface.  Pressing Choose ROM in the launcher makes the engine call
         window.Gen1WebBridge.pickRom(), which opens the picker below.

         Two elements still have to exist:
           #rom-picker  -- the bridge's only required element, it is what the
                           picker actually opens.
           #web-status  -- the bridge's live region.  It carries the messages
                           that have no other home ("ROM remise au moteur
                           local — aucun téléversement", "Impossible de lire
                           ce fichier local", "Le moteur n'est pas encore
                           prêt"), so it stays in the accessibility tree,
                           visually hidden rather than removed. -->
    <span id="web-status" role="status" aria-live="polite"
          style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0"
          >Initialisation…</span>
    <input id="rom-picker" type="file" accept=".gb,.gbc,application/octet-stream" hidden>
  </main>
  <noscript>JavaScript est indispensable pour exécuter la version WebAssembly.</noscript>
  <script src="web-mod-import.js?v=13.3-pwa-final"></script>
  <script src="web-bridge-v13.js?v=13.4-optional-rack"></script>
  <script src="player.js?v=11.5&amp;n=2&amp;g=game-v13.4-fr.love&amp;arg=%5B%22--web%22%5D"></script>
  <script>
    // Registered after load so it never competes with the engine's own
    // fetches for the wasm and the game archive.  updateViaCache:"none" is
    // explicit: the worker script itself must always be revalidated, or a
    // deploy -- and the kill switch inside it -- could be cached out.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("sw.js", { scope: "./", updateViaCache: "none" })
          .then(function (registration) { registration.update(); })
          .catch(function (error) { console.warn("SW registration failed", error); });
      }, { once: true });
    }
  </script>
</body>
</html>
